[project]
name = "learn-robotics"
version = "0.1.0"
description = "A 3-DOF arm, built up from first principles"
requires-python = ">=3.13"

# Dependencies are provided by the Nix flake, not installed by pip.
# This file exists for tooling configuration and package discovery.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
